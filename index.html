<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timestamp - Batch Image Date & Timestamp Overlay</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito:wght@400;600;700&family=Roboto+Mono:wght@400;500&family=Roboto:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- App CSS -->
    <link rel="stylesheet" href="css/styles.css">
    <!-- JSZip CDN for batch zip download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- Vercel Web Analytics -->
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Top Header Navigation -->
        <header class="app-header">
            <div class="logo">
                <i class="fa-regular fa-clock logo-icon"></i>
                <span class="logo-text">timestamp</span>
            </div>
            <div class="header-stats" id="headerStats">
                <span id="photoCountBadge">0 Photos</span>
            </div>
            <div class="header-actions">
                <button id="addMoreFilesBtn" class="btn btn-secondary" disabled>
                    <i class="fa-solid fa-plus"></i> Add Images
                </button>
                <button id="clearAllBtn" class="btn btn-secondary" disabled>
                    Clear
                </button>
                <button id="exportZipBtn" class="btn btn-primary" disabled>
                    <i class="fa-solid fa-download"></i> Download ZIP
                </button>
            </div>
        </header>

        <!-- Main Workspace -->
        <main class="app-workspace">
            <!-- Left Sidebar Controls -->
            <aside class="control-panel">
                <div class="panel-section">
                    <h3 class="section-title">Time Calculation</h3>
                    
                    <div class="form-group">
                        <label for="baseDate">Date</label>
                        <input type="date" id="baseDate" class="form-input">
                    </div>

                    <div class="form-row">
                        <div class="form-group flex-1">
                            <label for="startTime">First Photo Time</label>
                            <input type="time" id="startTime" class="form-input" value="08:31" step="1">
                        </div>
                        <div class="form-group flex-1">
                            <label for="endTime">Last Photo Time</label>
                            <input type="time" id="endTime" class="form-input" value="08:50" step="1">
                        </div>
                    </div>

                    <div class="time-summary-box" id="timeSummaryBox">
                        <div class="summary-item">
                            <span class="summary-label">Duration</span>
                            <span class="summary-value" id="totalDurationText">19 mins</span>
                        </div>
                        <div class="summary-item">
                            <span class="summary-label">Interval</span>
                            <span class="summary-value" id="intervalPerPhotoText">--</span>
                        </div>
                    </div>

                    <div class="form-group mt-2">
                        <label for="interpolationMode">Calculation Mode</label>
                        <select id="interpolationMode" class="form-select">
                            <option value="linear" selected>Linear Spacing (First to Last)</option>
                            <option value="step">Fixed Step (+Seconds/Photo)</option>
                        </select>
                    </div>

                    <div class="form-group hidden" id="stepIntervalGroup">
                        <label for="stepSeconds">Step Interval (seconds)</label>
                        <input type="number" id="stepSeconds" class="form-input" value="30" min="1">
                    </div>
                </div>

                <div class="panel-section">
                    <h3 class="section-title">Font & Stamp Style</h3>
                    
                    <div class="form-group">
                        <label for="fontFamily">Font Family</label>
                        <select id="fontFamily" class="form-select">
                            <option value="Inter, sans-serif" selected>Inter (Clean Sans - Reference)</option>
                            <option value="Roboto, sans-serif">Roboto</option>
                            <option value="Nunito, sans-serif">Nunito</option>
                            <option value="'Roboto Mono', monospace">Roboto Mono</option>
                            <option value="'Share Tech Mono', monospace">Share Tech Mono</option>
                            <option value="Arial, sans-serif">Arial</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="dateFormat">Format</label>
                        <select id="dateFormat" class="form-select">
                            <option value="DD/MM/YYYY HH:mm" selected>30/07/2026 10:44 (Reference Match)</option>
                            <option value="DD/MM/YYYY HH:mm:ss">30/07/2026 10:44:00</option>
                            <option value="YYYY-MM-DD HH:mm">2026-07-30 10:44</option>
                            <option value="MM/DD/YYYY hh:mm A">07/30/2026 10:44 AM</option>
                            <option value="DD MMM YYYY HH:mm">30 Jul 2026 10:44</option>
                            <option value="HH:mm">10:44 (Time Only)</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <div class="form-group flex-1">
                            <label for="fontSizePercent">Font Size</label>
                            <div class="range-with-val">
                                <input type="range" id="fontSizePercent" min="1" max="10" value="2.8" step="0.1">
                                <span id="fontSizeVal">2.8%</span>
                            </div>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group flex-1">
                            <label for="textColor">Text Color</label>
                            <div class="color-picker-wrapper">
                                <input type="color" id="textColor" value="#ffffff">
                                <span class="color-val-hex" id="textColorHex">#FFFFFF</span>
                            </div>
                        </div>
                        <div class="form-group flex-1">
                            <label for="textOpacity">Opacity</label>
                            <input type="range" id="textOpacity" min="0.1" max="1" value="0.95" step="0.05">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Visibility Enhancements</label>
                        <div class="checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="enableShadow" checked> Drop Shadow
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="enableOutline" checked> Dark Outline
                            </label>
                        </div>
                    </div>
                </div>

                <div class="panel-section">
                    <h3 class="section-title">Position & Padding</h3>
                    
                    <div class="position-grid">
                        <button class="pos-btn" data-pos="top-left" title="Top Left">Top Left</button>
                        <button class="pos-btn" data-pos="top-right" title="Top Right">Top Right</button>
                        <button class="pos-btn" data-pos="bottom-left" title="Bottom Left">Bottom Left</button>
                        <button class="pos-btn active" data-pos="bottom-right" title="Bottom Right">Bottom Right</button>
                    </div>

                    <div class="form-row mt-2">
                        <div class="form-group flex-1">
                            <label for="paddingPercent">Padding Offset (%)</label>
                            <input type="range" id="paddingPercent" min="0.5" max="10" value="3.5" step="0.5">
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Center Preview Area -->
            <section class="preview-area">
                <!-- Dropzone when no images uploaded -->
                <div id="dropzone" class="dropzone-container">
                    <div class="dropzone-card">
                        <i class="fa-regular fa-images dropzone-icon"></i>
                        <h2>Drop images here</h2>
                        <p class="dropzone-hint">or click to browse from your device</p>
                        <button class="btn btn-primary mt-3" id="selectFilesBtn">Select Images</button>
                        <input type="file" id="fileInput" multiple accept="image/*" class="hidden">
                    </div>
                </div>

                <!-- Main Canvas Preview viewport -->
                <div id="previewContainer" class="preview-viewport hidden">
                    <div class="preview-toolbar">
                        <div class="preview-info">
                            <span id="currentImageName">Filename.jpg</span>
                            <span id="currentImageIndex" class="badge">1 of 1</span>
                            <span id="currentImageDimensions" class="badge-dim">1920x1080</span>
                        </div>
                        <div class="preview-controls">
                            <button id="prevPhotoBtn" class="btn-icon" title="Previous Photo"><i class="fa-solid fa-chevron-left"></i></button>
                            <button id="nextPhotoBtn" class="btn-icon" title="Next Photo"><i class="fa-solid fa-chevron-right"></i></button>
                            <button id="downloadCurrentBtn" class="btn btn-secondary-sm" title="Download Image">
                                <i class="fa-solid fa-download"></i> Download Image
                            </button>
                        </div>
                    </div>

                    <div class="canvas-wrapper" id="canvasWrapper">
                        <canvas id="previewCanvas"></canvas>
                    </div>
                </div>

                <!-- Bottom Thumbnail Strip -->
                <div class="thumbnail-strip-container hidden" id="thumbnailStripContainer">
                    <div class="thumbnail-header">
                        <span>Photos (<span id="thumbCount">0</span>)</span>
                        <button id="sortByFilenameBtn" class="btn-text">Sort by Name</button>
                    </div>
                    <div class="thumbnail-strip" id="thumbnailStrip">
                        <!-- Thumbnail items dynamically injected here -->
                    </div>
                </div>
            </section>
        </main>

        <!-- Download / Export Modal -->
        <div id="exportModal" class="modal-backdrop hidden">
            <div class="modal-card">
                <div class="modal-header">
                    <h3>Processing Batch</h3>
                </div>
                <div class="modal-body">
                    <div class="progress-bar-wrapper">
                        <div id="exportProgressBar" class="progress-bar-fill" style="width: 0%;"></div>
                    </div>
                    <p class="progress-status-text" id="exportProgressText">Processing photo 0 of 0...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Application JavaScript Modules -->
    <script src="js/timestampEngine.js"></script>
    <script src="js/canvasRenderer.js"></script>
    <script src="js/batchProcessor.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
